# 沙箱实例专用 nginx 配置（2026-11-24）
# 与生产 deploy/nginx.conf 的区别：
#   1. 不做 80 → 443 跳转（沙箱 80 只给容器内健康检查用）
#   2. 不带 HSTS（避免影响同一域名下的生产站点）
#   3. 双层门禁：
#      · 第一层 Basic Auth —— 只拦页面与静态资源
#      · 第一层通过后种 cookie gws_sb=OK，/api/ 改由 cookie 放行
#   4. 监听容器内 443，宿主映射到 8443；生产 443 通过 sandbox.ntg.com.hk 反代进来
#
# 【为什么 /api/ 不能用 Basic Auth】（2026-11-24 踩坑）
# 前端 axios 会给每个请求显式设置 Authorization: Bearer <jwt>。
# 浏览器只有在请求「没有 Authorization 头」时才会附加 HTTP Basic 凭据；
# 一旦 JS 设了 Bearer，浏览器就不再补 Basic —— 于是 nginx 收到 Bearer、判定未认证、
# 返回 401 + WWW-Authenticate，浏览器弹框，输入多少次都进不去（死循环）。
# 因此 /api/ 改用 cookie 校验：cookie 由浏览器自动携带，不与 Bearer 冲突。

server {
    listen 80;
    server_name _;

    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # ---------- 后端接口：靠 cookie 放行（不能用 Basic Auth，见文件头说明）----------
    location /api/ {
        if ($cookie_gws_sb != "OK") {
            return 401;
        }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # ---------- 前端页面与静态资源：Basic Auth + 种门禁 cookie ----------
    location / {
        auth_basic "GWS Sandbox v2";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 不加 always：只让 2xx/3xx 带这个 cookie，401 不会种（否则等于门禁失效）
        add_header Set-Cookie "gws_sb=OK; Path=/; Max-Age=2592000; HttpOnly";

        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
