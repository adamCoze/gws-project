services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gws-app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/app/backend
      - ./dist:/app/dist
      - ./data/assessment-attachments:/app/data/assessment-attachments
      - ./deploy/nginx.conf:/etc/nginx/sites-available/default:ro
      - ./certs:/etc/nginx/certs:ro
      - ./acme:/var/www/acme:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
